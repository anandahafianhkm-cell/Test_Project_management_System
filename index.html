<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" a href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>Form Project Baru</h1>

        <form id="projectForm">
            <!-- Data Konsumen -->
            <div class="form-group-konsumen">
                <div class="nama-konsumen">
                    <label>Nama Konsumen</label>
                    <input type="text" id="nama_konsumen" required placeholder="masukkan nama konsumen">
                </div>

                <div class="hp-konsumen">
                    <label>Nomor HP Konsumen</label>
                    <input type="tel" id="nomor_hp_konsumen" required placeholder="masukkan nomor hp konsumen">
                </div>
            </div>



            <!-- Detail Project -->
            <div class="form-group-project">
                <div class="type-project">
                    <label>Jenis Project</label>
                    <select id="jenis_project" required>
                        <option value="">-- Pilih Jenis Project--</option>
                        <option value="Pajak Tahunan">Pajak Tahunan</option>
                        <option value="Pajak 5 Tahunan">Pajak 5 Tahunan</option>
                        <option value="Balik Nama">Balik Nama</option>
                        <option value="STNK Hilang">STNK Hilang</option>
                    </select>
                </div>

                <div class="data-project">
                    <label>Nomor Polisi</label>
                    <input type="text" id="nomor_polisi" required placeholder="masukkan nomor polisi">
                </div>
            </div>


            <!-- Vendor Mitra -->
            <div class="form-group-mitra">
                <div class="nama-mitra">
                    <label>Nama Mitra</label>
                    <input type="text" id="nama_mitra" required placeholder="masukkan nama mitra">
                </div>

                <div class="hp-mitra">
                    <label>Nomor HP Mitra</label>
                    <input type="tel" id="nomor_hp_mitra" required placeholder="masukkan nomor hp mitra">
                </div>
            </div>

            <!-- Keuangan -->
            <div class="form-group-keuangan">
                <h4>Rincian Keuangan</h4>
                <div class="biaya">
                    <label>Total Biaya</label>
                    <input type="number" id="total_biaya" min="0" value="0">
                </div>
                <div class="biaya">
                    <label>DP Dibayar (Rp)</label>
                    <input type="number" id="dp_dibayar" min="0" value="0">
                </div>
                <div class="biaya">
                    <label>Kekurangan Biaya</label>
                    <input type="number" id="kekurangan_biaya" value="0">
                </div>
            </div>

            <!-- Berkas Ditinggal -->
            <div class="form-group-berkas">
                <label>Berkas Yang Ditinggal</label>
                <div class="checkbox">
                    <label class="checkbox-label"><input type="checkbox" id="bpkb-asli">BPKB ASLI</label>
                    <label class="checkbox-label"><input type="checkbox" id="stnk-asli">STNK ASLI</label>
                    <label class="checkbox-label"><input type="checkbox" id="ktp-asli">KTP ASLI</label>
                </div>
                <div class="checkbox">
                    <label class="checkbox-label"><input type="checkbox" id="bpkb-fc">BPKB FOTOCOPY</label>
                    <label class="checkbox-label"><input type="checkbox" id="stnk-fc">STNK FOTOCOPY</label>
                    <label class="checkbox-label"><input type="checkbox" id="ktp-fc">KTP FOTOCOPY</label>
                </div>
            </div>

            <!-- Status-->
            <div class="form-group-status">
                <label>Status</label>
                <input type="text" id="status_proses" placeholder="berkas diterima">
            </div>

            <!-- Catatan -->
            <div class="form-group-catatan">
                <label>Catatan</label>
                <textarea id="catatan" rows="3" placeholder="tulis catatan khusus jika ada ...."></textarea>
            </div>

            <!-- Button Proses -->
            <button type="submit">Proses dan Simpan</button>

        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
